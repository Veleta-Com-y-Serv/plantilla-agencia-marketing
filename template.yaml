# Metadatos de la plantilla para el catálogo de NoExpertise.
id: agencia-marketing
nombre: Agencia y consultoría
descripcion: "Web directa y a todo color para agencias de marketing, consultoras y estudios de diseño web."
sectores:
  - { id: agencia, nombre: Agencia }
  - { id: marketing, nombre: Marketing }
  - { id: consultoria, nombre: Consultoría }
  - { id: diseno-web, nombre: Diseño web }
  - { id: publicidad, nombre: Publicidad }
secciones:
  - { id: hero, nombre: Portada }
  - { id: cifras, nombre: Cifras }
  - { id: servicios, nombre: Servicios }
  - { id: sectores, nombre: Sectores }
  - { id: sobre, nombre: El estudio }
  - { id: proceso, nombre: Cómo trabajamos }
  - { id: cita, nombre: Cita destacada }
  - { id: noticias, nombre: Blog }
  - { id: opiniones, nombre: Opiniones }
  - { id: preguntas, nombre: Preguntas frecuentes }
  - { id: cta, nombre: Llamada a la acción }
  - { id: contacto, nombre: Contacto }
estilo: directo
plan_minimo: presencia
version: 1.2.0
base: astrowind
demo_url: https://demo-plantilla-agencia-marketing.noexpertise.com
activa: true
orden: 170

# Páginas propias (docs/plantillas.md § Fichas por elemento y páginas por zona). Espejo en src/data/fichas.ts.
fichas:
  - { lista: servicios, campo: items, ruta: servicios, nombre: Servicio, tipo: Service }

# Varias páginas (docs/plantillas.md § Varias páginas): reparto recomendado al activar «Varias páginas».
# Inicio se queda con la portada y lo que no esté en ninguna página (aquí, cifras, blog, llamada a la acción).
paginas:
  - { ruta: servicios, titulo: Servicios, secciones: "servicios; sectores" }
  - { ruta: la-agencia, titulo: La agencia, secciones: "sobre; proceso; opiniones" }
  - { ruta: contacto, titulo: Contacto, secciones: "cita; preguntas; contacto" }

# Asistente de puesta en marcha (NoExpertise): un paso por pantalla. Rutas del site sin índices;
# tipos: texto y lista (la IA propone), datos, fotos, eleccion (colores y logo) y repaso.
asistente:
  - id: negocio
    titulo: "Tu agencia"
    pregunta: "¿Cómo se llama tu agencia o consultora y qué hacéis por vuestros clientes?"
    ayuda: "Qué ofrecéis, a qué tipo de negocios y desde dónde trabajáis."
    tipo: texto
    campos: [nombre, eslogan, seo.titulo, seo.descripcion, secciones.hero.antetitulo, secciones.hero.titulo, secciones.hero.texto, secciones.hero.items]
  - id: contacto
    titulo: "Cómo te encuentran"
    pregunta: "¿Dónde estáis y cómo os pueden llamar o escribir?"
    ayuda: "Solo lo que quieras que vean tus clientes. Lo que dejes vacío no sale en tu web."
    tipo: datos
    campos: [contacto.telefono, contacto.whatsapp, contacto.email, contacto.direccion, contacto.horario, redes.linkedin, redes.instagram, redes.facebook]
  - id: servicios
    titulo: "Servicios"
    pregunta: "¿Qué servicios dais? Uno por línea, como se lo contarías a un cliente."
    ayuda: "Nombre y una frase de cada uno. Los iconos los cambias luego en Contenido."
    tipo: lista
    campos: [secciones.servicios.items]
  - id: sectores
    titulo: "Con quién trabajáis"
    pregunta: "¿Con qué tipo de negocios o sectores trabajáis más?"
    ayuda: "Restaurantes, comercios, clínicas, industria… uno por línea."
    tipo: texto
    campos: [secciones.sectores.titulo, secciones.sectores.texto, secciones.sectores.items]
  - id: sobre
    titulo: "Quiénes sois"
    pregunta: "Cuéntame vuestra historia, qué os hace distintos y la frase que mejor os define."
    tipo: texto
    campos: [secciones.sobre.titulo, secciones.sobre.texto, secciones.sobre.items, secciones.cita.declaracion]
  - id: proceso
    titulo: "Cómo trabajáis"
    pregunta: "¿Cómo es trabajar con vosotros, desde la primera reunión hasta los resultados?"
    tipo: texto
    campos: [secciones.proceso.titulo, secciones.proceso.texto, secciones.proceso.items]
  - id: noticias
    titulo: "Tu blog"
    pregunta: "¿Sobre qué temas escribís o queréis escribir? Un artículo por línea."
    ayuda: "Si lo prefieres, añádelos luego en Contenido."
    tipo: lista
    campos: [secciones.noticias.noticias]
  - id: preguntas
    titulo: "Preguntas frecuentes"
    pregunta: "¿Qué os preguntan más a menudo antes de contrataros? Escribe cada pregunta y lo que respondéis."
    ayuda: "Si lo prefieres, añádelos luego en Contenido."
    tipo: lista
    campos: [secciones.preguntas.preguntas]
  - id: fotos
    titulo: "Tus fotos"
    pregunta: "Pon una foto de portada y, si quieres, alguna más del estudio y de tu trabajo."
    ayuda: "Sube las tuyas o elige una del banco. Las que no cambies se quedan como están."
    tipo: fotos
    campos: [secciones.hero.imagen, secciones.sobre.imagen, secciones.sectores.galeria, secciones.cta.imagen]
  - id: aspecto
    titulo: "Colores y logo"
    pregunta: "Elige los colores de tu web y, si tienes, tu logo."
    tipo: eleccion
    campos: [colores.primario, colores.acento, logo]
  - id: repaso
    titulo: "Repaso"
    tipo: repaso
