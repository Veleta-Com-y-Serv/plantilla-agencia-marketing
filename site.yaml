  sobre:
    activa: true
    antetitulo: El estudio
    titulo: Estrategas, no gestores de redes
    resalte: no gestores
    texto: |
      Lúcida nació en 2014 en un pequeño local de Russafa. Hoy somos seis personas y seguimos trabajando igual: pocas cuentas, mucho cuidado y números claros cada mes.

      Antes de proponerte nada, entendemos tu negocio. Si una acción no te va a traer clientes, te lo decimos, aunque eso signifique facturar menos.
    imagen: /fotos/sobre.jpg
    cta: { texto: Conoce cómo trabajamos, url: "/#proceso" }
    items:
      - { titulo: Una persona de referencia, texto: Siempre hablas con quien lleva tu cuenta., icono: usuarios }
      - { titulo: Sin permanencias, texto: Te quedas porque funciona y por nada más., icono: escudo }
      - { titulo: Informe mensual, texto: "Qué se ha hecho, qué ha pasado y qué toca ahora.", icono: grafico }
      - { titulo: Cerca de ti, texto: "En el estudio, en tu negocio o por videollamada.", icono: mapa }
    personas:
      - { nombre: Clara Benlloch, cargo: Dirección y estrategia, foto: /placeholders/persona.svg }
      - { nombre: Andreu Soler, cargo: Campañas y analítica, foto: /placeholders/persona.svg }
      - { nombre: Nuria Mompó, cargo: Diseño y web, foto: /placeholders/persona.svg }

  proceso:
    activa: true
    antetitulo: Método
    titulo: Del diagnóstico a los resultados en cuatro pasos
    resalte: resultados
    texto: "Sin contratos eternos ni informes que nadie lee. Sabes en todo momento qué hacemos y por qué."
    items:
      - { titulo: Diagnóstico gratuito, texto: "Una sesión de 40 minutos para conocer tu negocio, tus números y tus objetivos.", icono: lupa, duracion: Semana 1 }
      - { titulo: Plan de acción, texto: "Prioridades, canales y presupuesto por escrito. Tú decides qué hacemos y cuándo.", icono: diana, duracion: Semana 2 }
      - { titulo: Puesta en marcha, texto: "Montamos campañas, web y contenidos, y medimos desde el primer día.", icono: cohete, duracion: Semanas 3 a 6 }
      - { titulo: Mejora continua, texto: "Revisamos cada mes lo que funciona, quitamos lo que no y te lo contamos claro.", icono: grafico, duracion: Cada mes }

  cita:
    activa: true
    antetitulo: Lo que pensamos
    declaracion: "La mayoría de las empresas no tienen un problema de marketing. Tienen un problema de estrategia."
    resalte: problema de estrategia
    autor: "Clara Benlloch · Fundadora de Lúcida Estudio"

  noticias:
    activa: true
    antetitulo: Del blog
    titulo: Ideas que mueven negocios
    resalte: mueven negocios
    cta: { texto: Ver todos los artículos, url: "https://www.linkedin.com/" }
    noticias:
      - { titulo: "Cinco cosas que revisar en tu ficha de Google antes de pagar anuncios", texto: "Horarios, fotos, reseñas y categorías: lo básico que hace que te llamen sin gastar un euro.", fecha: 21 de octubre de 2026, categoria: SEO local, imagen: /fotos/noticia-1.jpg, url: "https://www.linkedin.com/" }
      - { titulo: "Por qué tus anuncios no venden (y no es culpa del algoritmo)", texto: "El anuncio solo trae a la gente. Lo que pasa después en tu web decide si compran.", fecha: 7 de octubre de 2026, categoria: Publicidad, imagen: /fotos/noticia-2.jpg, url: "https://www.linkedin.com/" }
      - { titulo: "Cómo medir el marketing de una pyme con una hoja y diez minutos", texto: "Tres números que conviene mirar cada lunes para saber si vas por buen camino.", fecha: 23 de septiembre de 2026, categoria: Estrategia, imagen: /fotos/noticia-3.jpg, url: "https://www.linkedin.com/" }

  opiniones:
    activa: true
    antetitulo: Opiniones
    titulo: Lo que dicen quienes ya trabajan con nosotros
    resalte: ya trabajan
    testimonios:
      - { texto: "En seis meses pasamos de depender del boca a boca a recibir reservas todas las semanas desde la web. Y entendemos cada euro que invertimos.", autor: Marta Ferrer, cargo: "Horno Ferrer, Benimaclet", nota: "5" }
      - { texto: "Nos dijeron que no hacía falta estar en todas las redes. Nos centramos en dos y por fin tenemos tiempo para atender a los clientes.", autor: Vicent Albors, cargo: "Clínica dental Albors", nota: "5" }
      - { texto: "Lo que más valoro es la claridad: cada mes sé qué se ha hecho y qué ha funcionado. Sin letra pequeña.", autor: Elena Cortina, cargo: "Despacho Cortina Abogados", nota: "5" }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Lo que nos preguntan antes de empezar
    resalte: antes de empezar
    cta: { texto: Pregúntanos lo que quieras, url: "/#contacto" }
    preguntas:
      - { pregunta: "¿La sesión de diagnóstico tiene algún coste?", respuesta: "No. Son 40 minutos, en el estudio o por videollamada, para conocer tu negocio y decirte qué haríamos. Sin compromiso." }
      - { pregunta: "¿Hay permanencia?", respuesta: "No. Trabajamos mes a mes. Te pedimos tres meses para ver resultados, pero puedes dejarlo cuando quieras." }
      - { pregunta: "¿Trabajáis solo con empresas de Valencia?", respuesta: "La mayoría de nuestros clientes son de Valencia y su comarca, pero trabajamos con negocios de toda España por videollamada." }
      - { pregunta: "¿Cuánto hay que invertir en publicidad?", respuesta: "Depende de tu sector y tus objetivos. En el diagnóstico te damos una cifra realista y nunca gastamos más de lo acordado por escrito." }
      - { pregunta: "¿Cómo sé si lo que hacéis funciona?", respuesta: "Cada mes recibes un informe sencillo con contactos, ventas y coste por cliente, y una reunión para decidir los siguientes pasos." }

