    items:
      - { titulo: Estrategia y consultoría, texto: "Analizamos tu negocio, tu competencia y tus clientes para decidir dónde invertir y dónde no.", icono: brujula, url: "/#contacto", destacado: false }
      - { titulo: Publicidad en Google y Meta, texto: "Campañas con presupuesto controlado, pruebas constantes y resultados que puedes ver cada semana.", icono: megafono, url: "/#contacto", destacado: true }
      - { titulo: SEO y contenidos, texto: "Que te encuentren cuando te buscan: posicionamiento local, blog y fichas de Google bien cuidadas.", icono: lupa, url: "/#contacto", destacado: false }
      - { titulo: Diseño web, texto: "Webs rápidas y fáciles de usar, con mensajes claros y formularios que llegan a tu correo.", icono: pantalla, url: "/#contacto", destacado: false }
